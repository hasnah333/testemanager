<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1e293b; }
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; padding: 28px 40px;
      box-shadow: 0 4px 16px rgba(79,70,229,.3);
    }
    header h1 { font-size: 1.8rem; font-weight: 700; }
    header p  { font-size: .95rem; opacity: .85; margin-top: 6px; }

    .tabs { display: flex; gap: 4px; padding: 20px 40px 0; }
    .tab {
      padding: 10px 28px; border-radius: 8px 8px 0 0;
      cursor: pointer; font-weight: 600; font-size: .9rem;
      border: 2px solid transparent; border-bottom: none;
      background: #e2e8f0; color: #64748b; transition: all .2s;
    }
    .tab.active { background: white; color: #4f46e5; border-color: #cbd5e1; }
    .tab:hover:not(.active) { background: #d1d5db; }

    .content { padding: 0 40px 40px; }
    .panel { display: none; background: white; border-radius: 0 12px 12px 12px;
             border: 2px solid #cbd5e1; padding: 32px; overflow-x: auto; }
    .panel.active { display: block; }

    svg text { font-family: 'Segoe UI', Arial, sans-serif; }

    .legend { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #475569; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
  </style>
</head>

  <div class="tab active" onclick="show('admin',this)">👤 Administrateur</div>

<script>
function show(role, tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + role).classList.add('active');
  tab.classList.add('active');
}
</script>
